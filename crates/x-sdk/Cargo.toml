[package]
name = "x-sdk"
version = "0.1.0"
description = "X API v2 client"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
], optional = true }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "form",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", optional = true }
url = "2.5.8"
x-sdk-gen = { path = "../x-sdk-gen", default-features = false }

[dev-dependencies]
http = "1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[features]
default = ["rustls"]
# `OAuth2Client::authorize_local`: a one-shot localhost listener for the redirect.
local = ["dep:tokio", "tokio/io-util", "tokio/net"]
# Streaming endpoints (`x_sdk::stream`) and `Pager::into_stream`.
stream = ["dep:futures-util", "dep:tokio", "tokio/time", "reqwest/stream"]
native-tls = ["x-sdk-gen/native-tls"]
rustls = ["x-sdk-gen/rustls"]
