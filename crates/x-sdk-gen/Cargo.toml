[package]
name = "x-sdk-gen"
version = "0.1.0"
description = "X API v2 core endpoints"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "serde",
  "std",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "multipart",
  "query",
  "form",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
serde_with = { version = "3.24.0", default-features = false, features = [
  "base64",
  "std",
  "macros",
] }
tokio = { version = "1.54.1", features = ["fs"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
url = "2.5.8"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
